<section class="car-viewer-container">
    <div class="principal-image">
        <img src="" alt="Imagen Principal" id="main-image" />
    </div>
    <div class="secondary-image-section">
        <div class="secondary-image">
            <img src="" alt="Imagen Secundaria 1" class="secondary-img" />
        </div>
        <div class="secondary-image">
            <img src="" alt="Imagen Secundaria 2" class="secondary-img" />
        </div>
        <div class="secondary-image">
            <img src="" alt="Imagen Secundaria 3" class="secondary-img" />
        </div>
    </div>
    <div class="mobile-carousel">
        <div class="carousel-container">
            <div class="carousel-track">
                <div class="carousel-slide">
                    <img src="" alt="Carousel Image 1" class="carousel-img" />
                </div>
                <div class="carousel-slide">
                    <img src="" alt="Carousel Image 2" class="carousel-img" />
                </div>
                <div class="carousel-slide">
                    <img src="" alt="Carousel Image 3" class="carousel-img" />
                </div>
                <div class="carousel-slide">
                    <img src="" alt="Carousel Image 4" class="carousel-img" />
                </div>
            </div>
        </div>
        <button class="carousel-button prev-button">&lt;</button>
        <button class="carousel-button next-button">&gt;</button>
        <div class="carousel-dots">
            <span class="dot active" data-index="0"></span>
            <span class="dot" data-index="1"></span>
            <span class="dot" data-index="2"></span>
            <span class="dot" data-index="3"></span>
        </div>
    </div>
</section>
