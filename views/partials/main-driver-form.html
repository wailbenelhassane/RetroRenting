<section id="main-driver-wrapper">
  <div id="main-driver-form-container">
    <div class="main-driver-header">
      <h2>INTRODUCE MAIN DRIVER INFORMATION</h2>
    </div>

    <div class="input-container">
      <form class="main-driver-form" id="main-driver-form" method="post">
        <div class="name-group">
          <input type="text" id="name" placeholder="Name" required/>
          <input type="text" id="surname" placeholder="Surname" required/>
        </div>

        <input type="text" id="email" placeholder="Email" required/>

        <div class="phone-group">
          <select id="country-phone" required></select>
          <input type="tel" id="phone" placeholder="Phone Number" required/>
        </div>

        <select id="country" required></select>

        <div class="btn-container">
          <button class="book-btn" type="submit">Pay now!</button>
        </div>
      </form>
    </div>
  </div>
</section>
