<div class="team-carousel-container" *ngIf="ourTeamService.teamImages.length > 0">
  <div class="team-carousel">
    <div class="team-image" *ngFor="let image of ourTeamService.teamImages; let i = index" [ngClass]="{'active': i === ourTeamService.currentIndex}">
      <img [src]="image.src" [alt]="image.alt">
    </div>
  </div>
</div>
<div class="team-carousel-container" *ngIf="ourTeamService.teamImages.length === 0">
  <p>No team images available</p>
</div>
