 <section class="catalog-section" *ngFor="let decade of catalogData$ | async; let i = index" [id]="[70, 80, 90][i]">
    <div class="catalog-title">{{ decade.title }}</div>
    <div class="catalog-card-container">
      <ion-card class="catalog-card" *ngFor="let card of decade.catalogCards" [ngClass]="{ 'favorited': (isCarFavorited[card.id] | async) }">
        <div class="catalog-card-image">
          <img [src]="card.image.src" [alt]="card.image.altText">
          <p>{{ card.title }}</p>
        </div>
        <div class="catalog-card-info">
          <p *ngFor="let infoText of card.info">{{ infoText }}</p>
          <div>
            <ion-button class="catalog-card-button" [attr.data-car-id]="card.id" (click)="onCardButtonClick(card.id)" fill="solid">See more</ion-button>
          </div>
        </div>
        <div class="favorite-button" (click)="toggleFavorite(card.id)" [ngClass]="{ 'disabled': !userLoggedIn && (isCarFavorited[card.id] | async) === undefined }">
          <img [src]="'assets/key-icon.svg'" [ngClass]="{ 'favorited': (isCarFavorited[card.id] | async) }" alt="Favorite Car">
        </div>
      </ion-card>
    </div>
  </section>
  <div class="catalog-section" *ngIf="(catalogData$ | async)?.length === 0">
    <p> No catalog sections available</p>
  </div>
