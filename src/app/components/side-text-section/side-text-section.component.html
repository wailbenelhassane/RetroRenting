<section class="side-text-section-container" [attr.data-section]="sectionKey" *ngIf="sectionData[sectionKey]">
  <div class="side-text-section-text">
    <h2>{{ sectionData[sectionKey]?.title }}</h2>
    <p>{{ sectionData[sectionKey]?.content }}</p>
  </div>
  <div class="side-text-section-image">
    <img [src]="sectionData[sectionKey]?.src" [alt]="sectionData[sectionKey]?.alt">
  </div>
</section>
