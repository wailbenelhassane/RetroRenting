<section class="car-catalog-container">
  <div class="car-catalog-image" (click)="onImageClick($event)">
    <img class="car-image" [src]="currentImage.src" [alt]="currentImage.altText" />

    <div class="mobile-controls">
      <button class="prev-btn" aria-label="Previous car" (click)="prevImage()"> &lt; </button>
      <button class="next-btn" aria-label="Next car" (click)="nextImage()"> &gt; </button>
    </div>
  </div>

  <ul class="car-catalog-menu desktop-menu">
    <li class="car-catalog-menu-item" *ngFor="let decade of decades"
        (mouseenter)="onMouseEnter(decade)">
      <a class="car-catalog-menu-item-element"
         [href]="'/RetroRenting/views/catalog.html#' + decade">
        {{decade}}'s Catalog
      </a>
    </li>
  </ul>

  <div class="mobile-menu">
    <a class="mobile-catalog-link"
       [href]="'/RetroRenting/views/catalog.html#' + decades[currentDecadeIndex]">
      {{decades[currentDecadeIndex]}}'s Catalog
    </a>
  </div>
</section>
