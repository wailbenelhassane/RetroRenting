<section id="main-driver-wrapper">
  <div id="main-driver-form-container">
    <div class="main-driver-header">
      <h2>INTRODUCE MAIN DRIVER INFORMATION</h2>
    </div>

    <div class="input-container">
      <form [formGroup]="driverForm" (ngSubmit)="onSubmit()" class="main-driver-form">
        <div class="name-group">
          <ion-input
            type="text"
            placeholder="First Name"
            formControlName="name"
            [class.invalid]="formErrors.includes('name') || formErrors.includes('invalidName')"
          ></ion-input>

          <ion-input
            type="text"
            placeholder="Last Name"
            formControlName="surname"
            [class.invalid]="formErrors.includes('surname') || formErrors.includes('invalidSurName')"
          ></ion-input>
        </div>

        <ion-input
          type="email"
          placeholder="Email"
          formControlName="email"
          [class.invalid]="formErrors.includes('email') || formErrors.includes('invalidEmail')"
        ></ion-input>

        <div class="phone-group">
          <ion-select
            formControlName="prefix"
            [class.invalid]="formErrors.includes('prefix')"
            interface="action-sheet"
          >
            <ion-select-option *ngFor="let country of countries" [value]="country.value">
              {{ country.prefix }}
            </ion-select-option>
          </ion-select>

          <ion-input
            type="tel"
            placeholder="Phone Number"
            formControlName="phone"
            [class.invalid]="formErrors.includes('phone') || formErrors.includes('invalidPhone')"
          ></ion-input>
        </div>

        <ion-select
          formControlName="country"
          [class.invalid]="formErrors.includes('country')"
          interface="action-sheet"
        >
          <ion-select-option *ngFor="let country of countries" [value]="country.value">
            {{ country.name }}
          </ion-select-option>
        </ion-select>

        <div class="btn-container">
          <ion-button class="book-btn" type="submit" fill="solid">Pay now!</ion-button>
        </div>

        <ul *ngIf="formErrors.length > 0" class="error-list">
          <li *ngFor="let error of formErrors">
            {{ validationService.getErrorMessage(error) }}
          </li>
        </ul>
      </form>
    </div>
  </div>
</section>
