<nav class="footer-nav" aria-label="Footer Navigation">
  <ul class="footer-menu">
    <li class="footer-item" *ngFor="let item of footerMenu">
      <a [href]="item.url">{{ item.title }}</a>
    </li>
    <li class="footer-item" *ngIf="!footerMenu.length">
      <span>No footer links available</span>
    </li>
  </ul>
</nav>
