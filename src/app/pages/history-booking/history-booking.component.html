<ion-content>
  <app-header></app-header>
    <h2>Your Bookings</h2>
    <div *ngIf="bookings.length === 0">
      <h3>No bookings found.</h3>
    </div>

    <ion-card *ngFor="let b of bookings" class="booking-card">
      <ion-card-header>
        <ion-card-title>{{ b.booking.car }} — {{ b.booking.location }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p><strong>From:</strong> {{ b.booking.pickupDate }} to {{ b.booking.returnDate }}</p>
        <p><strong>Driver:</strong> {{ b.driver.name }} {{ b.driver.surname }}</p>
        <p><strong>Email:</strong> {{ b.driver.email }} — <strong>Phone:</strong> {{ b.driver.phone }}</p>
      </ion-card-content>
    </ion-card>
</ion-content>
