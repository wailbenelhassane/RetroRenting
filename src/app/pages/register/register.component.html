<ion-content>
  <aside class="aside-image">
    <img class="background-aside-image"
         [ngSrc]="asideImgUrl"
         alt="Background image"
         width="1024"
         height="768">
  </aside>

  <main class="register-container">
    <header class="register-header">
      <div class="register-logo">
        <img class="logo-image"
             [ngSrc]="logoUrl"
             alt="Logo"
             width="1024"
             height="768">
      </div>
      <h1>Sign up!</h1>
    </header>

    <nav aria-label="Go back">
      <a id="back-link"
         href="#"
         onclick="history.back(); return false"> ← Go back</a>
    </nav>

    <section class="register-form-container">
      <form class="register-form"
            [formGroup]="registerForm"
            (ngSubmit)="onSubmit()">

        <div class="name-group">
          <ion-input type="text"
                     id="name"
                     formControlName="name"
                     placeholder="First Name"
                     [class.invalid]="formErrors.includes('name') || formErrors.includes('nameInvalid')"
                     autocomplete="off"></ion-input>

          <ion-input type="text"
                     id="surname"
                     formControlName="surname"
                     placeholder="Last Name"
                     [class.invalid]="formErrors.includes('surname') || formErrors.includes('surnameInvalid')"
                     autocomplete="off"></ion-input>
        </div>

        <ion-input type="email"
                   id="email"
                   formControlName="email"
                   placeholder="Email"
                   [class.invalid]="formErrors.includes('email') || formErrors.includes('emailInvalid')"></ion-input>

        <ion-input type="text"
                   id="username"
                   formControlName="username"
                   placeholder="Username"
                   [class.invalid]="formErrors.includes('username') || formErrors.includes('usernameInvalid')"></ion-input>

        <ion-input type="password"
                   id="password"
                   formControlName="password"
                   placeholder="Password"
                   [class.invalid]="formErrors.includes('password') || formErrors.includes('passwordInvalid')"></ion-input>

        <ion-input type="password"
                   id="confirm-password"
                   formControlName="confirmPassword"
                   placeholder="Confirm password"
                   [class.invalid]="formErrors.includes('confirmPassword') || formErrors.includes('confirmPasswordInvalid')"></ion-input>

        <ion-button class="register-btn" type="submit" fill="solid">Sign up</ion-button>
      </form>
    </section>

    <div *ngIf="formErrors.length > 0" class="error-list">
      <ion-list>
        <ion-item *ngFor="let error of formErrors" lines="none">
          {{ validationService.getErrorMessage(error) }}
        </ion-item>
      </ion-list>
    </div>

    <footer>
      <p id="sign-in-link">Already have an account?
        <a routerLink="/login" id="sign-in-btn">Sign in</a>
      </p>
    </footer>
  </main>
</ion-content>
